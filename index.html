<html lang="en">

  pointed at.  Neither the levels nor the writeup below the board live in this
  file; both are fetched at run time:

      ?levels=URL   the level set, as JSON     (default levels.json, the 86
                                                levels I designed when I was 10)
      ?readme=URL   the writeup, as Markdown   (default README.md)

  Both accept absolute or relative URLs.

  Code, pixel art, sound synthesis and level designs (c) 2026 Jim Pivarski.
  Released under the BSD 3-Clause License; see LICENSE.

  This is a from-scratch implementation. No code, art, or audio from any
  other project is included here.

  Mechanics reimplemented from the 1983 original by Douglas E. Smith
  (published by Broderbund). Game rules and algorithms are not copyrightable;
  the expression here is entirely original.

  "Lode Runner" is a trademark of Tozai Games. This project is unaffiliated
  with and unendorsed by Tozai Games or any other rights holder, and contains
  none of the commercial level data - in fact no level data at all.

  Behavioral reference consulted while implementing (read, never copied; it
  carries no license of any kind):
      LodeRunner_TotalRecall by Simon Hung
      https://github.com/SimonHung/LodeRunner_TotalRecall
  ===========================================================================
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='2' y='4' width='12' height='3' fill='%23ffe860'/%3E%3Crect x='2' y='8' width='12' height='5' fill='%23d8a418'/%3E%3Crect x='7' y='9' width='2' height='2' fill='%237a5000'/%3E%3C/svg%3E">
<title>Jim's Levels</title>
<style>
  :root {
    /* one line to make the margin fluid instead: clamp(12px, 2vmin, 28px).
       CSS px is already density-independent, so 20px is stable across DPRs. */
    --margin: 20px;
    --gutter: 58px;          /* width of the side bands in gutter mode */
    --ladder-shade: #96905e;   /* overwritten from PAL_TERRAIN.h at boot */
    --ink:   #cfd6dd;
    --dim:   #8c98a4;
    --faint: #5d6873;
    --warm:  #e8e4b0;
    --cyan:  #38d0e0;
    --gold:  #ffe860;
    --panel: #171c21;
    --rule:  #262e38;
  }
  html { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #000; color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { display: flex; flex-direction: column; align-items: center;
         justify-content: flex-start; outline: none; }

  /* The key bank spans the whole window and centres, so it stays readable on
     a wide monitor where the board itself is height-limited.  Everything else
     lives in #column, whose width JS pins to the playfield - so the HUD and
     the writeup are never wider than the board. */
  #stage { width: 100%; margin-top: var(--margin); }
  #keys { width: 100%; text-align: center; color: var(--dim);
          line-height: 2.1; padding: 0 var(--margin) 6px;
          box-sizing: border-box; }
  #column { width: 100%; margin: 0 auto; }
  #about { margin-left: auto; margin-right: auto; }

  /* ---- gutter arrangement ------------------------------------------------
     The board's aspect is fixed at 504:272, so on a viewport that is
     proportionally wider than that - every phone in landscape - it can only
     grow by getting TALLER, and it can only get taller if the chrome stops
     eating vertical space.  The same aspect already forces empty bands at
     the left and right, so the HUD and the command buttons move into them:
     the bands cost nothing, and the board gets the full height.  layout()
     measures both arrangements every time and keeps whichever makes the
     board bigger, so desktop is untouched.
     The keyboard legend is dropped here - this arrangement only ever wins on
     a phone-shaped viewport, where there is no keyboard to legend. */
  body.gutter #stage { position: relative; }
  body.gutter #keyhelp { display: none; }
  body.gutter #keys {
    position: absolute; top: 0; bottom: 0; right: 0; width: var(--gutter);
    padding: 0; display: flex; flex-direction: column;
    align-items: stretch; justify-content: center; gap: 5px;
  }
  body.gutter #cmds { display: flex; flex-direction: column; gap: 5px; }
  /* A narrow band cannot hold "restart" beside its key, so the label goes
     under it.  Hiding the labels instead would leave a bare "R" that means
     nothing. */
  body.gutter #keys .cmd {
    margin: 0; display: flex; flex-direction: column;
    align-items: center; gap: 2px; line-height: 1.25;
  }
  body.gutter #keys .cmd i { font-size: 9px; }
  body.gutter #hud {
    position: absolute; top: 0; bottom: 0; left: 0; width: var(--gutter);
    padding: 0; display: flex; flex-direction: column;
    justify-content: center; gap: 8px; text-align: center;
    font-size: 10px; line-height: 1.3;
  }
  body.gutter #tagline { flex: none; white-space: normal; overflow: visible; }
  /* the long instructional tagline will not fit a narrow band; the start cue
     still must, so keep that one and drop the other */
  body.gutter #tagline:not(.cue) { display: none; }
  #keys .sep { color: var(--faint); margin: 0 .45em; }
  #keys .cmd { white-space: nowrap; margin: 0 .35em; }
  #keys i { font-style: normal; }

  /* Mobile has no keyboard, so the infrequent commands double as buttons.
     The movement and shoot keys are deliberately NOT tappable: they are too
     small and needed far too often to be usable that way. */
  #keys .tap { cursor: pointer; border-radius: 4px; touch-action: manipulation;
               user-select: none; -webkit-user-select: none;
               -webkit-tap-highlight-color: transparent; }
  #keys .cmd.tap { padding: 1px 5px; }
  #keys .tap kbd, #keys kbd.tap { border-color: #6b7a88; }
  #keys .tap:hover kbd, #keys kbd.tap:hover { background: #222a31; }
  #keys .tap:active { color: var(--warm); }
  #keys .tap:active kbd, #keys kbd.tap:active {
               background: #2f3841; color: #fff; border-bottom-width: 1px;
               transform: translateY(1px); }

  /* The border marks exactly where the playable area starts and ends - which
     is what you need in order to judge whether a ladder reaches the top. */
  #wrap { position: relative; width: 100%;
          border: 2px solid var(--ladder-shade); padding: 2px; }
  canvas { display: block; width: 100%; background: #000;
           image-rendering: pixelated; image-rendering: crisp-edges; }
  /* Holds the board's box open for the moment between first paint and the
     levels arriving; layout() then sets an explicit height, which wins.
     On #cv and not on canvas, or the sprite sheet's own canvases - which are
     72x68, not 504x272 - get squashed into the board's shape. */
  #cv { aspect-ratio: 504 / 272; }

  #hud { display: flex; width: 100%; gap: 1em; padding-top: 6px;
         color: var(--dim); letter-spacing: .04em; }
  #hud b { color: var(--warm); font-weight: normal; }
  #tagline { flex: 1; text-align: center;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the centre slot does double duty: the tagline while playing, and the
     start cue while frozen.  A separate hint row cost a whole line of
     height, and on a landscape phone height is what limits the board. */
  #tagline.cue { color: var(--gold); }
  .nw { white-space: nowrap; }

  kbd { display: inline-block; min-width: 1.1em; padding: 1px 5px; margin: 0 1px;
        border: 1px solid #47525d; border-bottom-width: 2px; border-radius: 3px;
        background: var(--panel); color: var(--ink); font: inherit; }

  /* inset by the border width so overlays sit inside the frame, not over it */
  .overlay {
    position: absolute; inset: 2px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(0,0,0,.82); backdrop-filter: blur(2px); padding: 2em;
  }
  .overlay.hide { display: none; }
  .overlay h1 { margin: 0 0 .2em; font-size: 2.1em; color: var(--cyan);
                letter-spacing: .06em; font-weight: normal; }
  .overlay h2 { margin: 0 0 1em; font-size: 1.1em; color: var(--warm);
                font-weight: normal; }
  .overlay p  { margin: .35em 0; max-width: 46em; }
  .overlay .go { color: var(--gold); margin-top: 1.6em;
                 animation: blink 1.1s infinite steps(1); }
  @keyframes blink { 50% { opacity: .25 } }

  /* Shown in place of the board when the level file cannot be loaded.  It has
     to be its own element rather than borrowing #about: the writeup arrives
     independently, and whichever of the two landed second would erase the
     other. */
  #loadfail { width: 100%; max-width: 46em; line-height: 1.7; color: var(--dim);
              margin: calc(var(--margin) * 3) auto calc(var(--margin) * 2);
              padding: 0 var(--margin); }
  #loadfail.hide { display: none; }
  #loadfail h2 { color: var(--cyan); font-weight: normal; font-size: 1.25em;
                 line-height: 1.3; margin: 0 0 .8em; }
  #loadfail pre { background: var(--panel); border: 1px solid var(--rule);
                  border-radius: 4px; padding: .8em 1em; color: var(--warm);
                  white-space: pre-wrap; overflow-x: auto; }
  /* With no board there is no width to inherit, so charge it side padding. */
  body.loadfail #about { padding-left: var(--margin); padding-right: var(--margin); }

  /* ---- the writeup, rendered from Markdown at load time ----
     Running text gets its own typography, deliberately unlike the game's.
     The board and its chrome are monospace at 13px because they are a grid of
     fixed-width cells; prose is not, and prose set to the board's width came
     out at about 157 characters a line - more than twice the 75 or so that is
     comfortable to read.  So: a proportional face, a size above the browser's
     own 16px default, and a column of its own rather than the board's width,
     which on a wide monitor is enormous.  On a phone the board is narrower
     than the column, so the two still line up.
     A rule above and below, both the width of the column: the text reads as
     one panel with a clear end, rather than trailing off the page. */
  #about { width: 100%; max-width: 580px;      /* ~75 characters at 17px */
           font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                        Roboto, Helvetica, Arial, sans-serif;
           font-size: 17px; line-height: 1.65; color: var(--ink);
           margin: calc(var(--margin) * 2) auto calc(var(--margin) * 3);
           padding: var(--margin) 0;
           border-top: 2px solid var(--ladder-shade);
           border-bottom: 2px solid var(--ladder-shade); }
  /* ...and without this the pair of them would draw a stray double rule under
     the board on a page whose writeup has not arrived yet, or has none */
  #about:empty { display: none; }
  /* the first and last blocks give up their own margins, so the space inside
     the two rules is the padding above and exactly the padding below */
  #about > :first-child { margin-top: 0; }
  #about > :last-child { margin-bottom: 0; }
  /* Headings are cream and bold; links are cyan and underlined.  They used to
     share --cyan, which made every link look like a heading. */
  #about h1, #about h2, #about h3, #about h4 {
           color: var(--warm); font-weight: 600; line-height: 1.25;
           letter-spacing: .01em; margin: 1.9em 0 .5em; }
  #about h1 { font-size: 1.5em; }
  #about h2 { font-size: 1.28em; }
  #about h3 { font-size: 1.12em; }
  #about h4 { font-size: 1em; color: var(--ink); }
  #about p { margin: .8em 0; }
  #about li { margin: .8em 0; padding-left: .15em; }
  #about strong { color: var(--warm); font-weight: 600; }
  #about em { color: inherit; }
  #about a { color: var(--cyan); text-decoration-thickness: 1px;
             text-underline-offset: .18em; text-decoration-color: #2b8f9c; }
  #about a:hover { color: #7ce6f2; text-decoration-color: #7ce6f2; }
  #about ul, #about ol { padding-left: 1.5em; }
  /* code stays monospace even though the prose around it no longer is, and is
     nudged down because a monospace face at the same px looks bigger */
  #about code, #about pre {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: .88em; }
  #about code { background: var(--panel); color: var(--warm);
                padding: .1em .35em; border-radius: 3px; }
  #about pre { background: var(--panel); border: 1px solid var(--rule);
               border-radius: 4px; padding: .8em 1em; overflow-x: auto;
               line-height: 1.5; margin: 1em 0; }
  #about pre code { background: none; padding: 0; color: var(--ink);
                    font-size: 1em; }
  #about blockquote { margin: 1em 0; padding: .2em 0 .2em 1em;
                      color: var(--dim);
                      border-left: 2px solid var(--ladder-shade); }
  #about hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
  /* Block, so that a picture on a line of its own centres in the column - and
     block whether or not it is wrapped in a link, since Markdown puts a bare
     image straight into #about but a linked one inside a paragraph, where an
     inline image would sit against the left edge instead. */
  #about img { max-width: 100%; height: auto;
               display: block; margin-left: auto; margin-right: auto; }
  #about table { border-collapse: collapse; margin: 1em 0; }
  #about th, #about td { border: 1px solid #3a4048; padding: .35em .8em;
                         text-align: left; }
  #about th { background: var(--panel); color: var(--warm); font-weight: normal; }

  /* A phone in landscape is proportionally wider than the board's 504:272,
     so the board is always height limited there and vertical chrome is
     expensive: on a 844x390 viewport the original spacing cost 183px of
     board width.  Shrink the margin and the help text rather than hiding
     them. */
  /* Any short window benefits from smaller help text... */
  @media (max-height: 560px) {
    #keys { font-size: 10px; line-height: 1.5; padding-bottom: 3px; }
    #keys kbd { padding: 0 3px; margin: 0; border-bottom-width: 1px; }
    #keys .cmd { margin: 0 .3em; }
    #keys .sep { margin: 0 .25em; }
    #hud { font-size: 11px; padding-top: 3px; letter-spacing: 0; }
  }

  /* ...but give up the 20px margin only when the height is genuinely
     phone-sized (a landscape phone is 375-412px), so an ordinary short
     desktop window keeps the margin it was asked to have. */
  @media (max-height: 480px) {
    :root { --margin: 8px; }
  }

  /* A finger needs far more than a 10px glyph.  These grow the row by about
     14px, which costs roughly 26px of board width on a landscape phone -
     worth it for commands you cannot otherwise reach without a keyboard. */
  @media (pointer: coarse) {
    :root { --gutter: 72px; }
    #keys .cmd.tap { padding: 7px 9px; }
    /* an em-based min-width shrinks with the compact font, so pin it in px */
    #keys kbd.tap { min-width: 30px; padding: 7px 6px; }
  }

  #sheet { padding: 24px; }
  #sheet h3 { color: var(--cyan); font-weight: normal; margin: 1.4em 0 .5em; }
  #sheet .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  #sheet figure { margin: 0; text-align: center; color: var(--faint); font-size: 11px; }
</style>

<!-- The writeup is Markdown now, fetched and rendered here instead of being
     pre-rendered into this file by a script.  Pinned by version and by SRI
     hash; marked publishes no .min.js, so this is the UMD build that is
     actually in the npm package.  `defer` so that the game's own script (at
     the end of <body>) runs first and gets the level fetch started without
     waiting on the CDN. -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.umd.js"
        integrity="sha384-TuL/7aNYXEDWjlcHi2CR+Een2A5pigrtJ97Tmx3WG69mx5kCSp8yKHRISW9xSmgq"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"
        integrity="sha384-uUMu9JDY09vBzRf9SPcK2VgUj+W/70J6Soc+Dded5P474ElQ63iv9j5N3DE7Kp3N"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body tabindex="0">

<div id="stage">

<div id="keys">
  <span id="keyhelp"><span class="cmd"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>/<kbd>Q</kbd><kbd>E</kbd></span>
  <span class="sep">or</span>
  <span class="cmd"><kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd>/<kbd>U</kbd><kbd>O</kbd> move/shoot</span>
  <span class="sep">&middot;</span></span><span id="cmds"><span class="cmd tap" data-tap="Space" role="button" aria-label="pause"><kbd>Space</kbd> <i>pause</i></span>
  <span class="cmd tap" data-tap="KeyR" role="button" aria-label="restart level"><kbd>R</kbd> <i>restart</i></span>
  <span class="cmd"><span class="pair"><kbd class="tap" data-tap="BracketLeft" role="button" aria-label="previous level">[</kbd><kbd
       class="tap" data-tap="BracketRight" role="button" aria-label="next level">]</kbd></span> <i>level</i></span>
  <span class="cmd"><span class="pair"><kbd class="tap" data-tap="Minus" role="button" aria-label="slower">-</kbd><kbd
       class="tap" data-tap="Equal" role="button" aria-label="faster">+</kbd></span> <i>speed</i></span>
  <span class="cmd tap" data-tap="KeyM" role="button" aria-label="mute"><kbd>M</kbd> <i>mute</i></span></span>
</div>

<div id="column">

  <div id="wrap">
    <canvas id="cv"></canvas>

    <div id="pause" class="overlay hide">
      <h1>PAUSED</h1>
      <p class="go">press <kbd>Space</kbd> to resume</p>
    </div>

    <div id="win" class="overlay hide">
      <h1>CONGRATULATIONS!</h1>
      <h2 id="winTitle"></h2>
      <p id="winNote"></p>
      <p class="go">press <kbd>R</kbd> to play again from level 1</p>
    </div>
  </div>

  <div id="hud">
    <span>LEVEL <span class="nw"><b id="hudLevel">1</b> / <b id="hudCount">-</b></span></span>
    <span id="tagline" class="cue">loading levels...</span>
    <span>SPEED <span class="nw"><b id="hudSpeed">mid</b></span></span>
    <span>SOUND <span class="nw"><b id="hudSound">on</b></span></span>
  </div>

</div>
</div>

<div id="loadfail" class="hide"></div>

<section id="about"></section>

<script>
"use strict";

/* ========================================================================
   Geometry.  Physics runs in 40x40 "logical units" per tile, moved 8 units
   at a time, so an actor crosses a tile in exactly 5 steps - the same 5 in
   both axes, which is what the 1984 Macintosh original does: its offsets are
   bytes in [0,4] with the tile centre at 2, stepped by one per tick, running,
   climbing, hanging and falling alike.  There is no separate fall speed.
   The 18x17 pixel art is a completely separate concern, mapped at draw time
   (the original blits on the same 18x17 pitch).
   ======================================================================== */
const TW = 28, TH = 16;              // playfield, in tiles
const AW = 18, AH = 17;              // art pixels per tile
const LW = 40, LH = 40;              // logical units per tile
const W2 = 20, H2 = 20, W4 = 10, H4 = 10;
const XMOVE = 8, YMOVE = 8;

/* The original is paced by a VBL task: it arms a counter with the Options
   menu's speed setting and spins until the 60.15 Hz retrace has counted it
   down.  The three menu settings are delays of 2, 3 and 4 retraces, so what
   the setting changes is the tick RATE and nothing else - every count below,
   and every count in ticks anywhere in this file, is the same at any speed.
   `-` and `+` pick between three of them here on the same principle.  High is
   the original's fastest setting, low is half of it, and mid - the default -
   is the average of the two.  (The original's middle setting was 2/3, not
   3/4, if you ever want to match it exactly.) */
const BASE_TICK_MS = 2000 / 60.15;         /* HI: 60.15/2 ticks per second */
const SPEEDS = [{ name: "low", rate: 0.5 },
                { name: "mid", rate: 0.75 },
                { name: "high",  rate: 1 }];
let speedIndex = 1;                        /* MID */
let TICK_MS = BASE_TICK_MS / SPEEDS[speedIndex].rate;

/* Shooting is the one place this deliberately departs from the original, which
   took 24 ticks and - worse - re-validated the shot every tick and abandoned
   it if a guard stepped into the debris tile.  That is what made firing with
   apparently plenty of time still get you killed.  Here the hole is real from
   the instant the shot goes off and the dig is half as long, so firing is a
   reliable defence.  Both changes only ever make the game easier, so a level
   that was solvable on the original still is.  See FINDINGS.md section 14. */
const DIG_TICKS   = 12;   // runner frozen this long while shooting
const HOLE_TICKS  = 180;  // how long a hole stays fully open, after the dig
const HOLE_WARN   = 20;   // refill art plays over the final N ticks
const SHAKE_MOVES = 38;   // guard's hole countdown - in guard MOVES, not ticks
const SHAKE_WOBBLE = 12;  // ... at or below this it wobbles in place
const SHAKE_CLIMB  = 6;   // ... at or below this it climbs out
const BORN_TICKS  = 20;   // materialising, counted every tick
const DIE_TICKS   = 30;   // death animation, then the level reloads

/* Horizontal offsets the original walks a trapped guard through while it
   wobbles, indexed by (shakeLeft - SHAKE_CLIMB - 1).  Straight out of the
   6-byte table at CODE 1 + 0x1eb0 - there it reads 2,1,2,3,2,1 against a
   centre of 2, which is these signed offsets times our 8 units per step. */
const WOBBLE = [0, -8, 0, 8, 0, -8];

/* Tiles */
const EMPTY=0, BRICK=1, STEEL=2, LADDER=3, ROPE=4, TRAP=5, HLADDER=6,
      GOLD=7, GUARD=8, RUNNER=9;
const CHAR2TILE = {".":EMPTY, "#":BRICK, "=":STEEL, "H":LADDER, "-":ROPE,
                   "X":TRAP, "S":HLADDER, "$":GOLD, "G":GUARD, "P":RUNNER};

/* Actions */
const A_STOP=0, A_LEFT=1, A_RIGHT=2, A_UP=3, A_DOWN=4, A_FALL=5,
      A_IN_HOLE=6, A_CLIMB_OUT=7, A_REBORN=8;

/* ========================================================================
   Sprite art.  Every grid is exactly 17 rows of exactly 18 characters.
   "." is transparent; every other character indexes a palette below.
   Left-facing poses are generated by mirroring at atlas-build time.
   ======================================================================== */
const ART = {

/* ---- terrain ------------------------------------------------------------
                     0         1
                     012345678901234567                                  */
brick: [            "cccccccccccccccccc",
                    "caaaaaaaacaaaaaaaa",
                    "cbbbbbbbbcbbbbbbbb",
                    "cbbbbbbbbcbbbbbbbb",
                    "cbbbbbbbbcbbbbbbbb",
                    "cbbbbbbbbcbbbbbbbb",
                    "cccccccccccccccccc",
                    "aaaacaaaaaaaacaaaa",
                    "bbbbcbbbbbbbbcbbbb",
                    "bbbbcbbbbbbbbcbbbb",
                    "bbbbcbbbbbbbbcbbbb",
                    "cccccccccccccccccc",
                    "caaaaaaaacaaaaaaaa",
                    "cbbbbbbbbcbbbbbbbb",
                    "cbbbbbbbbcbbbbbbbb",
                    "cbbbbbbbbcbbbbbbbb",
                    "cbbbbbbbbcbbbbbbbb"],

steel: [            "dddddddddddddddddd",
                    "deeeeeeeeeeeeeeeef",
                    "dedeeeeeeeeeeeedef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "deeeeeeeeeeeeeeeef",
                    "dedeeeeeeeeeeeedef",
                    "deeeeeeeeeeeeeeeef",
                    "ffffffffffffffffff"],

ladder: [           "..ggh........ggh..",
                    "..ggh........ggh..",

/* ========================================================================
   Atlas.  Each grid is decoded once into an offscreen canvas, then blitted.
   A typo in ~380 lines of hand-drawn art is easy to make and invisible at
   runtime, so validate shape and palette coverage up front and fail loudly.
   ======================================================================== */
function validateGrid(name, grid, pal) {
  if (grid.length !== AH) throw Error(name + ": " + grid.length + " rows, want " + AH);
  grid.forEach(function (row, y) {
    if (row.length !== AW)
      throw Error(name + " row " + y + ": " + row.length + " chars, want " + AW);
    for (const ch of row)
      if (ch !== "." && !(ch in pal))
        throw Error(name + " row " + y + ': char "' + ch + '" not in palette');
  });
}

function gridToCanvas(grid, pal, alpha) {
  const cv = document.createElement("canvas");
  cv.width = AW; cv.height = AH;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(AW, AH);
  const cache = {};
  for (let y = 0; y < AH; y++) {
    for (let x = 0; x < AW; x++) {
      const ch = grid[y][x];
      if (ch === ".") continue;
      let rgb = cache[ch];
      if (!rgb) {
        const h = pal[ch];
        rgb = cache[ch] = [parseInt(h.substr(1, 2), 16),
                           parseInt(h.substr(3, 2), 16),
                           parseInt(h.substr(5, 2), 16)];
      }
      const o = (y * AW + x) * 4;
      img.data[o] = rgb[0]; img.data[o+1] = rgb[1];
      img.data[o+2] = rgb[2]; img.data[o+3] = Math.round(255 * (alpha === undefined ? 1 : alpha));
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

function mirrored(src) {
  const cv = document.createElement("canvas");
  cv.width = AW; cv.height = AH;
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.translate(AW, 0); ctx.scale(-1, 1);
  ctx.drawImage(src, 0, 0);
  return cv;
}

/* apply a blast mask to the brick grid */
function maskedBrick(mask) {
  return ART.brick.map(function (row, y) {
    let out = "";
    for (let x = 0; x < AW; x++) out += (mask[y][x] === "X") ? row[x] : ".";
    return out;
  });
}

const TERRAIN_KEYS = ["brick", "steel", "ladder", "rope", "gold"];
const POSE_KEYS = ["run1", "run2", "run3", "climb", "fall",
                   "hang1", "hang2", "hang3", "shoot",
                   "shake1", "shake2", "shake3", "born1", "born2"];

const SP = {};   /* sprite canvases, keyed by name */

function buildAtlas() {
  TERRAIN_KEYS.forEach(function (k) {
    validateGrid(k, ART[k], PAL_TERRAIN);
    SP[k] = gridToCanvas(ART[k], PAL_TERRAIN);
  });
  /* a revealed trap is the brick at half alpha; a not-yet-revealed hidden
     ladder is never drawn at all */
  SP.trapOpen = gridToCanvas(ART.brick, PAL_TERRAIN, 0.5);

  MASKS.forEach(function (mask, i) {
    mask.forEach(function (row, y) {
      if (row.length !== AW) throw Error("mask " + i + " row " + y + " width " + row.length);
      if (mask.length !== AH) throw Error("mask " + i + " has " + mask.length + " rows");
    });
    SP["brickMask" + i] = gridToCanvas(maskedBrick(mask), PAL_TERRAIN);
  });

  POSE_KEYS.forEach(function (k) {
    validateGrid(k, ART[k], PAL_RUNNER);
    SP["r_" + k] = gridToCanvas(ART[k], PAL_RUNNER);
    SP["r_" + k + "_L"] = mirrored(SP["r_" + k]);
    SP["g_" + k] = gridToCanvas(ART[k], PAL_GUARD);
    SP["g_" + k + "_L"] = mirrored(SP["g_" + k]);
  });
  /* ghosted materialize frame */
  SP.g_born2 = gridToCanvas(ART.born2, PAL_GUARD, 0.5);
  SP.g_born2_L = mirrored(SP.g_born2);

  /* the blaster with the muzzle flash suppressed, so it can pulse while
     firing instead of sitting there lit for the whole dig */
  const dimShoot = ART.shoot.map(function (row) { return row.replace(/5/g, "."); });
  SP.r_shootDim = gridToCanvas(dimShoot, PAL_RUNNER);
  SP.r_shootDim_L = mirrored(SP.r_shootDim);
  SP.g_shootDim = gridToCanvas(dimShoot, PAL_GUARD);
  SP.g_shootDim_L = mirrored(SP.g_shootDim);

  console.log("atlas ok: " + Object.keys(SP).length + " sprites, " +
              AW + "x" + AH + " px, " +
              (TERRAIN_KEYS.length + MASKS.length + POSE_KEYS.length) + " hand-drawn grids");
}

/* ========================================================================
   Level data.  The levels are not in this file: they are fetched from the
   JSON file named by ?levels=URL, default levels.json, absolute or relative.

       {"title": "Jim's Levels",
        "win":   "the sentence the win overlay ends with",
        "levels": [
           {"board": "
       ............................
              ... 16 rows of exactly 28 characters ...
       ............................
       "},
           {"board": "
       ...
       "}
       ]}

       .  empty          X  trap (false brick, drawn as #)
       #  brick          S  hidden ladder (appears when all gold is taken)
       =  steel          $  gold
       H  ladder         G  guard
       -  rope           P  player

   A board is written as 16 real lines because that is the only way to see it,
   which costs one relaxation of JSON (escapeControlsInStrings) and one
   flattening step (flattenBoard) - the engine below still reads one
   448-character string per level and does not know the difference.

   `title` becomes the document title, and `win` and the level count fill the
   win overlay, so nothing in this file names any particular set.

   Both bundled sets were decoded from the nibble-packed original level files
   in original-files/ (Apple II style level disk: a 262-byte header, then 224
   bytes per level, 448 nibbles = 28x16 tiles row-major, low nibble = left
   tile, high nibble = right tile; the first all-zero level ends the set,
   which is how one file holds 86 and the other 30).  Two cells in Jim's level
   16 held nibble values 13 and 14, which are not valid tile types; both were
   isolated cells in open space and are mapped to empty.  Every other level
   re-encodes byte-identically to the original.
   ======================================================================== */
const QS = new URLSearchParams(location.search);
const LEVELS_URL = QS.get("levels") || "levels.json";
const README_URL = QS.get("readme") || "README.md";

/* Filled in by init() before the game starts.  `LEVELS` stays the one name the
   rest of the game reads, exactly as it was when the levels were inline. */
let LEVELS = [], LEVEL_TITLE = "", LEVEL_WIN = "";

/* JSON.parse rejects a literal newline inside a string literal, and a board is
   nothing but literal newlines.  So walk the text once and escape every
   control character that occurs INSIDE a string, leaving everything outside
   strings alone so the file's own layout is untouched.  Tracking the in-string
   state is the whole job: a quote toggles it, and a backslash inside a string
   swallows the next character, so \" does not toggle and \\ does not swallow
   the quote that follows it.
   The cost of the relaxation: the level files are not strictly valid JSON, so
   jq and Python's json.load will not read them as they stand. */
const JSON_ESCAPES = { "\n": "\\n", "\r": "\\r", "\t": "\\t",
                       "\b": "\\b", "\f": "\\f" };
function escapeControlsInStrings(text) {
  let out = "", inStr = false, esc = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (esc) { out += ch; esc = false; continue; }     /* escaped, verbatim */
    if (ch === "\\") { out += ch; esc = inStr; continue; }
    if (ch === '"') { inStr = !inStr; out += ch; continue; }
    if (inStr && ch < " ") {
      out += JSON_ESCAPES[ch] ||
             ("\\u" + ch.charCodeAt(0).toString(16).padStart(4, "0"));
      continue;
    }
    out += ch;
  }
  return out;
}

/* 16 lines of 28 characters in, one 448-character row-major string out - the
   shape buildLevel has always read.  The board is trimmed as a whole, and
   trailing spaces are dropped per line since no tile character is a space, so
   one can only be an accident.  LEADING whitespace is deliberately kept:
   dropping it would silently shift a row sideways, whereas keeping it fails
   the width check below, or is named as a bad character by validateLevels. */
function flattenBoard(board, num, url) {
  const where = url + " level " + num;
  const rows = board.trim().split(/\r?\n/).map(function (r) {
    return r.replace(/[ \t]+$/, "");
  });
  if (rows.length !== TH)
    throw Error(where + " has " + rows.length + " rows; expected " + TH);
  rows.forEach(function (r, y) {
    if (r.length !== TW)
      throw Error(where + " row " + (y + 1) + " is " + r.length +
                  " characters; expected " + TW + ' ("' + r + '")');
  });
  return rows.join("");
}

function parseLevelFile(text, url) {
  let data;
  try {
    data = JSON.parse(escapeControlsInStrings(text));
  } catch (err) {
    throw Error(url + " is not valid JSON: " + err.message +
                "\n(the position is counted after escaping, where each board " +
                "is one line, so it will not match the line numbers in the file)");
  }
  if (!data || typeof data !== "object" || Array.isArray(data))
    throw Error(url + ": expected a JSON object with title, win and levels");
  if (typeof data.title !== "string" || !data.title)
    throw Error(url + ': "title" must be a non-empty string');
  if (typeof data.win !== "string")
    throw Error(url + ': "win" must be a string');
  if (!Array.isArray(data.levels) || !data.levels.length)
    throw Error(url + ': "levels" must be a non-empty array');
  const boards = data.levels.map(function (entry, i) {
    if (!entry || typeof entry.board !== "string")
      throw Error(url + " level " + (i + 1) + ': needs a "board" string');
    return flattenBoard(entry.board, i + 1, url);
  });
  return { title: data.title, win: data.win, boards: boards };
}

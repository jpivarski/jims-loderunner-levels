let map = [], guards = [], runner = null;
let goldLeft = 0, goldComplete = false;
let holes = [], digging = null;
let level = 0, state = "ready";
let terrainDirty = true;
let deadTimer = 0, passTimer = 0;
let moveOffset = 0, moveId = 0;
let hiddenLadders = [];
let luckCounter = 0;

const el = function (id) { return document.getElementById(id); };

function newActor(x, y) {
  return { pos: { x: x, y: y, xOffset: 0, yOffset: 0 },
           action: A_STOP, face: 1, dist: 0, anim: "stand",
           hasGold: 0, shakeTick: 0, bornTick: 0, dieTick: 0,
           falling: false, fallFrom: 0 };
}

/* A tile has two layers.  `base` is static terrain; `act` is dynamic
   occupancy and is what every collision and pathing test reads.  A brick
   that has been blasted keeps base = BRICK while act = EMPTY - that is
   exactly how the hole stays walkable and how refill knows what to put
   back.  Leaving a tile restores act from base, except that a blasted
   brick, an unrevealed hidden ladder, and gold all restore to EMPTY. */
function leaveTile(x, y) {
  const c = map[x][y];
  let t = c.base;
  if (t === BRICK || t === GOLD) t = EMPTY;
  c.act = t;
}

function guardAt(x, y) {
  for (const g of guards)
    if (g.pos.x === x && g.pos.y === y && g.action !== A_REBORN) return g;
  return null;
}

function buildLevel(n) {
  const s = LEVELS[n];
  map = []; guards = []; runner = null; holes = []; digging = null;
  goldLeft = 0; goldComplete = false; moveOffset = 0; moveId = 0;
  hiddenLadders = [];
  /* The original only zeroes its counter when a new game starts, so it drifts
     across levels and restarts.  We zero it per level instead, which makes a
     level replay identically every time - the same board and the same inputs
     always give the same guards. */
  luckCounter = 0;
  for (let x = 0; x < TW; x++) {
    map[x] = [];
    for (let y = 0; y < TH; y++) map[x][y] = { base: EMPTY, act: EMPTY, trapSeen: false };
  }
  /* Bottom-to-top, right-to-left.  The original unpacks a level from (27,15)
     back to (0,0) (CODE 1 @0x2c0e / @0x2c2a) and registers each guard as it
     meets it, so its guard list is in reverse reading order - and that list
     order is the round-robin turn order, which decides who moves first when a
     tick hands out fewer steps than there are guards.  It also decides which
     five survive the cap on an over-populated level. */
  for (let y = TH - 1; y >= 0; y--) {
    for (let x = TW - 1; x >= 0; x--) {
      const t = CHAR2TILE[s[y * TW + x]];
      const c = map[x][y];
      switch (t) {
        case GOLD:    c.base = GOLD;    c.act = EMPTY; goldLeft++; break;
        /* A hidden ladder is not put on the board at all - the original
           lifts it out into a side list and leaves the cell genuinely bare
           (CODE 1 @0x2c5c), which is why a buried guard can come back on one
           and why one gives a charging guard no footing.  The original's list
           holds 45; the most any level in either set needs is 44. */
        case HLADDER: c.base = EMPTY; c.act = EMPTY; hiddenLadders.push([x, y]); break;
        case GUARD:
          c.base = EMPTY;
          if (guards.length < 5) { c.act = GUARD; guards.push(newActor(x, y)); }
          else c.act = EMPTY;
          break;
        case RUNNER:
          c.base = EMPTY;
          if (!runner) { c.act = RUNNER; runner = newActor(x, y); } else c.act = EMPTY;
          break;
        default: c.base = t; c.act = t;
      }
    }
  }
  if (goldLeft === 0) revealLadders();
  terrainDirty = true;
  updateHud();
}

function revealLadders() {
  for (const [x, y] of hiddenLadders) {
    const c = map[x][y];
    c.base = LADDER;
    if (c.act === EMPTY) c.act = LADDER;
  }
  goldComplete = true;
  terrainDirty = true;
}

function decGold() {
  if (goldLeft > 0) goldLeft--;
  updateHud();
  if (goldLeft === 0 && !goldComplete) { revealLadders(); sfx("reveal"); }
}

/* ========================================================================
   Movement primitives.  Crossing rule: when the offset passes the tile
   half-width, hand over to the next tile and fold the offset back.
   ======================================================================== */
/* Step a perpendicular offset one notch toward the middle of the tile.  The
   original does this on every move that actually happens - a vertical move
   pulls the horizontal offset in and vice versa (CODE 1 @0x5fcc, @0x5fec) -
   and never on a move that was blocked. */
function towardZero(v, step) {
  if (v > 0) return Math.max(0, v - step);
  if (v < 0) return Math.min(0, v + step);
  return 0;
}

/* True when the actor has reached, or gone past, the middle of its tile in
   the direction it is heading - the only moment the original consults the
   tile ahead. */
function atCentreFor(p, action) {
  if (action === A_LEFT)  return p.xOffset <= 0;
  if (action === A_RIGHT) return p.xOffset >= 0;
  if (action === A_UP)    return p.yOffset <= 0;
  return p.yOffset >= 0;                 /* A_DOWN and A_FALL */
}

/* ========================================================================
   Runner
   ======================================================================== */
let keyAction = A_STOP, pendingShoot = 0;

function moveRunner() {
  const p = runner.pos;
  const cur = map[p.x][p.y].base;
  let falling;

  /* Fall state is decided before input is even looked at, and while falling
     there is no air control at all. */
  if (cur === LADDER || (cur === ROPE && p.yOffset === 0)) falling = false;
  else if (p.yOffset < 0) falling = true;
  else if (p.y < TH - 1) {
    const nb = map[p.x][p.y + 1].act;
    /* note what does NOT hold you up: rope, trap and gold below all drop you */
    falling = !(nb === BRICK || nb === LADDER || nb === STEEL || nb === GUARD);
  } else falling = false;

  /* Sound the fall once, on the transition into it, and thud on landing if
     the drop was more than half a tile.  Guards are deliberately silent here:
     with up to five of them stepping off ledges it would be constant chatter. */
  if (falling) {
    if (!runner.falling) {
      runner.falling = true;
      runner.fallFrom = p.y * LH + p.yOffset;
      fallStart();
    }
    pendingShoot = 0;
    runnerStep(A_FALL, false);
    return;
  }
  if (runner.falling) {
    runner.falling = false;
    fallStop();
    if ((p.y * LH + p.yOffset) - runner.fallFrom > H2) sfx("land");
  }

  if (pendingShoot) { const d = pendingShoot; pendingShoot = 0; tryShoot(d); return; }

  if (keyAction === A_LEFT || keyAction === A_RIGHT ||
      keyAction === A_UP || keyAction === A_DOWN) {
    runnerStep(keyAction, false);
  } else {
    runner.dist = 0;
    runner.anim = (map[p.x][p.y].base === ROPE && p.yOffset === 0) ? "hang" : "stand";
    afterRunnerStep();
  }
}

function runnerStep(action, blocked) {
  const p = runner.pos;

  /* Pressing down turns into a fall unless a ladder or a guard is directly
     beneath.  This is what drops you off a rope and off the end of a floor. */
  if (action === A_DOWN && p.y < TH - 1) {
    const nb = map[p.x][p.y + 1].act;
    if (nb !== LADDER && nb !== GUARD) action = A_FALL;
  }

  /* Off a ladder there is exactly one way up: out of the tile that sits on a
     ladder's top, and only while still above that tile's middle.  The original
     allows that step and refuses it at the middle (CODE 1 @0x4f92), so the
     runner walks its last sub-steps and comes to rest dead centre in the tile
     above the ladder - which is the position the level exit tests for.  Note
     this is a move, not a block: blocking here would strand the runner a
     sub-step or two high and make the top of every such ladder a dead end. */
  if (action === A_UP) {
    const onLadder = map[p.x][p.y].base === LADDER;
    const ladderBelow = p.y < TH - 1 && map[p.x][p.y + 1].base === LADDER;
    if (!onLadder && !(ladderBelow && p.yOffset > 0)) {
      runner.dist = 0; runner.anim = "stand"; return afterRunnerStep();
    }
  }

  /* The way ahead is only consulted once the actor has reached the middle of
     its tile, and a blocked actor then changes nothing at all - it does not
     edge back toward the centre.  Those two rules together are why everything
     comes to rest exactly centred against a wall or on a floor, with no
     re-centring code anywhere, and they are what stops an actor briefly
     blocked by a moving guard from sliding backwards.  Every direction in the
     original is gated this way (CODE 1 @0x59b6, @0x5a68, @0x5b56, @0x5c4e for
     guards, @0x4e0e and friends for the runner). */
  if (!blocked && atCentreFor(p, action)) {
    if (action === A_LEFT || action === A_RIGHT) {
      const nx = p.x + (action === A_LEFT ? -1 : 1);
      if (nx < 0 || nx >= TW) blocked = true;
      else {
        const t = map[nx][p.y].act;
        if (t === BRICK || t === STEEL || t === TRAP) blocked = true;
      }
    } else if (action === A_UP) {
      if (p.y <= 0) blocked = true;
      else {
        const t = map[p.x][p.y - 1].act;
        if (t === BRICK || t === STEEL || t === TRAP) blocked = true;
      }
    } else {
      if (p.y >= TH - 1) blocked = true;
      else {
        const t = map[p.x][p.y + 1].act;
        if (t === BRICK || t === STEEL) blocked = true;
      }
    }
  }

  const onRope = map[p.x][p.y].base === ROPE;

  switch (action) {
    case A_LEFT:
    case A_RIGHT: {
      const d = action === A_LEFT ? -1 : 1;
      runner.face = d;
      if (!blocked) {
        p.xOffset += d * XMOVE;
        runner.dist += XMOVE;
        if (d < 0 && p.xOffset < -W2) { leaveTile(p.x, p.y); p.x--; p.xOffset += LW; map[p.x][p.y].act = RUNNER; }
        else if (d > 0 && p.xOffset > W2) { leaveTile(p.x, p.y); p.x++; p.xOffset -= LW; map[p.x][p.y].act = RUNNER; }
        p.yOffset = towardZero(p.yOffset, YMOVE);
      }
      runner.anim = (map[p.x][p.y].base === ROPE) ? "hang" : "run";
      break;
    }
    case A_UP: {
      if (!blocked) {
        p.yOffset -= YMOVE;
        runner.dist += YMOVE;
        if (p.yOffset < -H2) { leaveTile(p.x, p.y); p.y--; p.yOffset += LH; map[p.x][p.y].act = RUNNER; }
        p.xOffset = towardZero(p.xOffset, XMOVE);
      }
      runner.anim = "climb";
      break;
    }
    default: {   /* A_DOWN and A_FALL */
      if (!blocked) {
        p.yOffset += YMOVE;
        runner.dist += YMOVE;
        if (p.yOffset > H2) { leaveTile(p.x, p.y); p.y++; p.yOffset -= LH; map[p.x][p.y].act = RUNNER; }
        p.xOffset = towardZero(p.xOffset, XMOVE);
      }
      /* No explicit rope catch: the fall rule already treats a rope as solid
         at the tile centre, so a fall through one stops there by itself. */
      runner.anim = action === A_FALL ? "fall"
                  : onRope ? "hang" : "climb";
      break;
    }
  }
  afterRunnerStep();
}

function afterRunnerStep() {
  const p = runner.pos, c = map[p.x][p.y];

  if (c.base === TRAP && !c.trapSeen) { c.trapSeen = true; terrainDirty = true; }

  if (c.base === GOLD && inPickupWindow(p)) {
    c.base = EMPTY; terrainDirty = true;
    sfx("gold"); decGold();
  }
}

/* Dead centre, and only dead centre.  The original gates gold pickup on both
   sub-tile offsets being exactly 2 of 5 - the tile's middle step (CODE 1
   @0x635c) - which our signed offsets write as zero.  Because a step is
   always a whole 8 units out of 40, an actor crossing a tile always lands on
   the centre exactly once, so nothing can be skipped over. */
function inPickupWindow(p) {
  return p.xOffset === 0 && p.yOffset === 0;
}

/* Lethality is pure tile occupancy, and it is one-directional: in the whole
   of the original there are exactly five places that set the death flag, and
   all five are in guard movement, at the moment a guard finishes crossing
   into a tile whose occupancy reads RUNNER.  Walking into a guard yourself
   does not kill you - the runner's own movement code has no death test at
   all.  (The other two ways to die are a hole closing on you and the Abort
   Man menu item.)
   This is what makes a guard crossing a tile boundary lethal at up to 0.8 of
   a tile of centre separation, and it is why the earlier symmetric 12x14
   proximity box - about 0.3 of a tile, and lethal on the runner's own step -
   made tight corridors behave differently from the original. */
function guardEnteredRunner(g) {
  if (g.action === A_REBORN) return;
  if (g.pos.x === runner.pos.x && g.pos.y === runner.pos.y) killRunner();
}

function killRunner() {
  if (state !== "run") return;
  fallStop();
  state = "dead";
  deadTimer = DIE_TICKS;
  runner.anim = "die";
  runner.dieTick = 0;
  sfx("dead");
}

/* ========================================================================
   Shooting a block.  The target is the tile diagonally below-forward; the
   tile directly forward is where the debris goes and must be clear.
   ======================================================================== */
function tryShoot(dir) {
  const p = runner.pos;
  runner.face = dir;
  runner.anim = "shoot";
  runner.dist = 0;
  const tx = p.x + dir, ty = p.y + 1;
  if (ty > TH - 1 || tx < 0 || tx >= TW) return afterRunnerStep();
  if (map[tx][ty].act !== BRICK) return afterRunnerStep();
  /* Terrain in the way still refuses the shot - the debris has to go
     somewhere - but a guard standing there does not.  The original refused,
     which meant the one moment you most want to fire was the moment the key
     stopped working; now the floor goes out from under him instead. */
  const debris = map[tx][p.y];
  if (debris.act !== EMPTY && debris.act !== GUARD) return afterRunnerStep();
  if (debris.base === GOLD) return afterRunnerStep();
  p.xOffset = 0; p.yOffset = 0;
  /* frame 1, not 0: the tick that starts the dig is itself the first of them */
  digging = { x: tx, y: ty, tick: 1, dir: dir };
  /* The floor gives way at once, while the brick is still visibly crumbling.
     A guard that steps into the debris tile now finds nothing underfoot and
     drops in, because a guard weighs up gravity before it weighs up chasing
     you - so firing in time is what saves you, and being slow to fire is what
     kills you.  Winding the clock back by the dig length leaves the hole open
     for its full HOLE_TICKS after the crumble finishes, on top of the dig
     itself, so a hole is never open for less time than before. */
  openHole(tx, ty, -DIG_TICKS);
  sfx("shoot");
}

/* Nothing left to decide: the hole already exists, so this is just the brace
   the runner holds while the brick comes apart. */
function processDig() {
  const d = digging;
  runner.anim = "shoot";
  runner.face = d.dir;
  d.tick++;
  terrainDirty = true;
  if (d.tick >= DIG_TICKS) digging = null;
}

function openHole(x, y, t0) {
  map[x][y].act = EMPTY;
  holes.push({ x: x, y: y, t: t0 || 0 });
  terrainDirty = true;
}

function processHoles() {
  for (let i = holes.length - 1; i >= 0; i--) {
    const h = holes[i];
    h.t++;
    if (h.t >= HOLE_TICKS - HOLE_WARN) terrainDirty = true;   /* refill art */
    if (h.t >= HOLE_TICKS) {
      const c = map[h.x][h.y];
      if (c.act === RUNNER) killRunner();
      else if (c.act === GUARD) {
        const g = guardAt(h.x, h.y);
        if (g) {
          if (g.hasGold > 0) { g.hasGold = 0; decGold(); }   /* carried gold is destroyed */
          guardReborn(g);
        }
      }
      c.act = BRICK;
      holes.splice(i, 1);
      terrainDirty = true;
    }
  }
}

/* ========================================================================
   Guards.  Slowness is how many guards get a full-size step each tick, not
   smaller steps: a phase counter cycles 0,1,2 and the row for the current
   guard count says how many steps to hand out that tick, round-robin.  The
   original stores the same thing as a bit pattern and counts set bits
   (CODE 1 @0x1eb6, dispatched at @0x5982); these are those numbers.
   Row 1 gives a lone guard 2/3 of the runner's speed, not 1/2 - that is the
   original's value, and it is the one number here that differs from
   LodeRunner_TotalRecall, which retuned it.
   The original also adds a difficulty tier to the row index, but that tier
   only advances once you wrap past the last level of the set, so on a first
   pass through a set it is always zero.
   ======================================================================== */
const movePolicy = [
  [0, 0, 0],
  [0, 1, 1],   /* 2/3 */
  [1, 1, 1],   /* 1/2 */
  [1, 2, 1],   /* 4/9 */
  [1, 2, 2],   /* 5/12 */
  [2, 2, 2]    /* 2/5 */
];

function moveGuards() {
  if (!guards.length) return;
  moveOffset = (moveOffset + 1) % 3;
  let moves = movePolicy[Math.min(guards.length, movePolicy.length - 1)][moveOffset];
  while (moves-- > 0) {
    /* Pick, then advance.  The original's cursor is 1-based and it increments
       before use, wrapping back to 1 rather than 0 (CODE 1 @0x5d6e), so the
       first guard to move is the first in the list - which is the opposite of
       advancing before picking from a 0-based array. */
    const g = guards[moveId];
    moveId = (moveId + 1) % guards.length;
    /* A materialising guard still burns its turn, and so does a trapped one -
       which is the whole reason a guard's time in a hole stretches out as the
       guard count rises: the countdown ticks once per turn, not once per
       frame. */
    if (g.action === A_REBORN) continue;
    /* Keyed on the countdown, not on the action: the countdown is the state,
       exactly as in the original, and it has to keep ticking through the
       climb-out or the guard never gets free. */
    if (g.shakeTick > 0) { shakeStep(g); continue; }
    guardStep(g, bestMove(g));
    if (state !== "run") return;
  }
}

/* One turn for a guard sitting in a hole.  Three phases, all counted in
   turns: sit still, wobble from side to side on the original's own 6-entry
   offset table, then climb out.  Climbing is done by the ordinary mover,
   because bestMove answers A_UP for free while the countdown runs. */
function shakeStep(g) {
  g.shakeTick--;
  if (g.shakeTick > SHAKE_WOBBLE) { g.anim = "shake"; return; }
  if (g.shakeTick > SHAKE_CLIMB) {
    g.anim = "shake";
    g.pos.xOffset = WOBBLE[g.shakeTick - SHAKE_CLIMB - 1];
    return;
  }
  g.anim = "climb";
  guardStep(g, bestMove(g));
}

function bestMove(g) {
  const p = g.pos, rp = runner.pos;

  /* Trapped in a blasted brick with the countdown still running: climb
     straight out.  No ladder needed, and gravity stays suspended until the
     countdown expires, which is what stops the guard dropping back in.  The
     original needs no state for this beyond the countdown itself - it just
     asks whether it is standing in a brick (CODE 1 @0x621c). */
  if (g.shakeTick > 0) {
    if (map[p.x][p.y].base === BRICK) return A_UP;
  } else {
    const cur = map[p.x][p.y].base;
    if (cur === LADDER || (cur === ROPE && p.yOffset === 0)) { /* supported */ }
    else if (p.yOffset < 0) return A_FALL;
    else if (p.y < TH - 1) {
      const nb = map[p.x][p.y + 1].act;
      /* the runner does not hold a guard up - guards fall right through you */
      if (nb === EMPTY || nb === RUNNER) return A_FALL;
      if (!(nb === BRICK || nb === STEEL || nb === GUARD || nb === LADDER)) return A_FALL;
    }
  }

  /* Same-floor charge, deliberately ignoring walls: a guard will happily run
     into a brick and stall.  That is authentic, not a bug.  The probe needs a
     hold at the guard's own row, or the bottom of the board, or terrain
     underfoot - and "terrain underfoot" is everything except open air and a
     false brick, tested on the static layer, so a guard standing below does
     not count and an unrevealed hidden ladder does not either
     (CODE 1 @0x624c).  The original charges whether or not the runner is
     falling. */
  if (p.y === rp.y) {
    let x = p.x;
    while (x !== rp.x) {
      const cur = map[x][p.y].base;
      const nb = (p.y < TH - 1) ? map[x][p.y + 1].base : STEEL;
      if (cur === LADDER || cur === ROPE || p.y >= TH - 1 ||
          (nb !== EMPTY && nb !== TRAP))
        x += (x < rp.x) ? 1 : -1;
      else break;
    }
    if (x === rp.x) {
      if (p.x < rp.x) return A_RIGHT;
      if (p.x > rp.x) return A_LEFT;
      return p.xOffset < rp.xOffset ? A_RIGHT : A_LEFT;
    }
  }
  return scanFloor(g);
}

/* The scan: find how far the current floor runs, then score every vertical
   route off it.  The rating constants encode the whole preference order --
   reach the runner's row (nearest column wins) > end up above > end up
   below -- and evaluation order breaks ties. */
function scanFloor(g) {
  const startX = g.pos.x, y = g.pos.y, rY = runner.pos.y;
  let best = 255, bestPath = A_STOP;

  function supported(x) {
    const t = map[x][y].act;
    if (t === BRICK || t === STEEL) return -1;                 /* wall: stop before it */
    if (t === LADDER || t === ROPE || y >= TH - 1) return 1;
    const nb = map[x][y + 1].base;
    if (nb === BRICK || nb === STEEL || nb === LADDER) return 1;
    return 0;                                                  /* one past the edge */
  }

  let x = startX;
  while (x > 0) { const s = supported(x - 1); if (s < 0) break; x--; if (s === 0) break; }
  const leftEnd = x;
  x = startX;
  while (x < TW - 1) { const s = supported(x + 1); if (s < 0) break; x++; if (s === 0) break; }
  const rightEnd = x;

  function rate(endY, col, path) {
    let r;
    if (endY === rY) r = Math.abs(startX - col);
    else if (endY > rY) r = endY - rY + 200;
    else r = rY - endY + 100;
    if (r < best) { best = r; bestPath = path; }
  }

  function scanDown(col, path) {
    let yy = y;
    while (yy < TH - 1) {
      const nb = map[col][yy + 1].base;
      if (nb === BRICK || nb === STEEL) break;
      const cur = map[col][yy].base;
      if (cur !== EMPTY) {
        if (col > 0) {
          const t = map[col - 1][yy + 1].base;
          if (t === BRICK || t === LADDER || t === STEEL || map[col - 1][yy].base === ROPE)
            if (yy >= rY) break;
        }
        if (col < TW - 1) {
          const t = map[col + 1][yy + 1].base;
          if (t === BRICK || t === LADDER || t === STEEL || map[col + 1][yy].base === ROPE)
            if (yy >= rY) break;
        }
      }
      yy++;
    }
    rate(yy, col, path);
  }

  function scanUp(col, path) {
    let yy = y;
    while (yy > 0 && map[col][yy].base === LADDER) {
      if (col > 0) {
        const t = map[col - 1][yy].base;
        if (t === LADDER || t === ROPE ||
            (yy < TH - 1 && (map[col - 1][yy + 1].base === BRICK || map[col - 1][yy + 1].base === STEEL)))
          if (yy <= rY) break;
      }
      if (col < TW - 1) {
        const t = map[col + 1][yy].base;
        if (t === LADDER || t === ROPE ||
            (yy < TH - 1 && (map[col + 1][yy + 1].base === BRICK || map[col + 1][yy + 1].base === STEEL)))
          if (yy <= rY) break;
      }
      yy--;
    }
    rate(yy, col, path);
  }

  /* own column first so it wins ties, then left end inward, then right end.
     Climbing is not even considered from the top row - the original tests the
     row against zero before every up-scan (CODE 1 @0x606a, @0x6110, @0x61ba),
     and without that a guard already on row 0 rates "stay on row 0" as
     reaching the runner's row and dithers instead of coming down. */
  let nb;
  if (y < TH - 1 && (nb = map[startX][y + 1].base) !== BRICK && nb !== STEEL) scanDown(startX, A_DOWN);
  if (y > 0 && map[startX][y].base === LADDER) scanUp(startX, A_UP);

  let curPath = A_LEFT;
  x = leftEnd;
  for (;;) {
    if (x === startX) {
      if (curPath === A_LEFT && rightEnd !== startX) { curPath = A_RIGHT; x = rightEnd; }
      else break;
    }
    if (y < TH - 1 && (nb = map[x][y + 1].base) !== BRICK && nb !== STEEL) scanDown(x, curPath);
    if (y > 0 && map[x][y].base === LADDER) scanUp(x, curPath);
    x += (curPath === A_LEFT) ? 1 : -1;
  }
  return bestPath;
}

function guardStep(g, action) {
  const p = g.pos;
  let blocked = false;

  if (action === A_STOP) { g.dist = 0; g.anim = "stand"; return; }

  if (action === A_DOWN && p.y < TH - 1) {
    const nb = map[p.x][p.y + 1].act;
    if (nb !== LADDER && nb !== GUARD) action = A_FALL;
  }

  if (action === A_LEFT || action === A_RIGHT) g.face = action === A_LEFT ? -1 : 1;

  /* Same centre-gated rule as the runner; see runnerStep. */
  if (atCentreFor(p, action)) {
    if (action === A_LEFT || action === A_RIGHT) {
      const nx = p.x + (action === A_LEFT ? -1 : 1);
      if (nx < 0 || nx >= TW) blocked = true;
      else {
        const c = map[nx][p.y];
        /* trap is tested on `base`, not `act`: otherwise, while the runner is
           hiding inside a false brick, act reads RUNNER and guards walk in */
        if (c.act === BRICK || c.act === STEEL || c.act === GUARD || c.base === TRAP) blocked = true;
      }
    } else if (action === A_UP) {
      if (p.y <= 0) blocked = true;
      else {
        const c = map[p.x][p.y - 1];
        if (c.act === BRICK || c.act === STEEL || c.act === TRAP || c.act === GUARD) blocked = true;
      }
    } else {
      if (p.y >= TH - 1) blocked = true;
      else {
        const c = map[p.x][p.y + 1];
        if (c.act === BRICK || c.act === STEEL || c.act === GUARD) blocked = true;
      }
    }
  }

  let crossed = false;
  switch (action) {
    case A_LEFT:
    case A_RIGHT: {
      const d = action === A_LEFT ? -1 : 1;
      if (!blocked) {
        p.xOffset += d * XMOVE;
        g.dist += XMOVE;
        if (d < 0 && p.xOffset < -W2) { leaveTile(p.x, p.y); p.x--; p.xOffset += LW; crossed = true; }
        else if (d > 0 && p.xOffset > W2) { leaveTile(p.x, p.y); p.x++; p.xOffset -= LW; crossed = true; }
        p.yOffset = towardZero(p.yOffset, YMOVE);
      }
      g.anim = (map[p.x][p.y].base === ROPE) ? "hang" : "run";
      break;
    }
    case A_UP: {
      if (!blocked) {
        p.yOffset -= YMOVE;
        g.dist += YMOVE;
        if (p.yOffset < -H2) { leaveTile(p.x, p.y); p.y--; p.yOffset += LH; crossed = true; }
        p.xOffset = towardZero(p.xOffset, XMOVE);
      }
      g.anim = "climb";
      break;
    }
    default: {
      if (!blocked) {
        p.yOffset += YMOVE;
        g.dist += YMOVE;
        if (p.yOffset > H2) { leaveTile(p.x, p.y); p.y++; p.yOffset -= LH; crossed = true; }
        p.xOffset = towardZero(p.xOffset, XMOVE);
      }
      g.anim = action === A_FALL ? "fall" : "climb";
      break;
    }
  }

  g.action = action;
  map[p.x][p.y].act = GUARD;

  if (crossed) guardCross(g);

  /* Dropped into a blasted hole.  The original arms the countdown when the
     guard reaches the middle sub-tile step of the hole, not on entering it
     (CODE 1 @0x5e96), which is why the guard visibly settles before it starts
     struggling. */
  if (action === A_FALL && map[p.x][p.y].base === BRICK && p.yOffset === 0) {
    g.action = A_IN_HOLE;
    g.anim = "shake";
    g.shakeTick = SHAKE_MOVES;
    sfx("trap");
    if (g.hasGold > 0) {
      /* drop it on the tile above the hole if that tile is free, else it is
         destroyed - which can itself finish the level's gold and reveal the
         hidden ladders */
      if (p.y > 0 && map[p.x][p.y - 1].base === EMPTY && map[p.x][p.y - 1].act === EMPTY) {
        map[p.x][p.y - 1].base = GOLD;
        terrainDirty = true;
      } else decGold();
      g.hasGold = 0;
    }
    return;
  }

  guardGold(g);
  guardEnteredRunner(g);
}

function guardGold(g) {
  const p = g.pos, c = map[p.x][p.y];
  if (g.hasGold === 0 && c.base === GOLD && inPickupWindow(p)) {
    c.base = EMPTY;
    terrainDirty = true;
    /* removed from the map but NOT counted as collected - it is still in play.
       The original takes the hold length straight off the shared counter
       (CODE 1 @0x6398, one's-complemented), giving 1..28 crossings. */
    g.hasGold = luck() + 1;                            /* 1..28 crossings */
  }
}

/* The hold counts down one per tile crossed.  On reaching zero the guard
   drops the gold wherever it happens to be standing, provided that tile's
   terrain is bare - there is no requirement for anything solid underfoot,
   and no cooldown afterwards (CODE 1 @0x6322).  If the tile is not bare the
   count stays at one and it tries again next crossing. */
function guardCross(g) {
  const p = g.pos, c = map[p.x][p.y];
  if (g.hasGold > 1) g.hasGold--;
  else if (g.hasGold === 1) {
    if (c.base === EMPTY) {
      c.base = GOLD;
      terrainDirty = true;
      g.hasGold = 0;
    }
  }
}

/* The original has no random number generator.  Everything that looks random
   - which column a buried guard comes back in, how long a guard carries gold
   - is read off one byte that advances by one every single tick and wraps at
   28 (CODE 1 @0x5604).  Reproducing that exactly matters, because the
   respawn search consumes it as it scans, so the counter and the board
   geometry together decide where guards reappear. */
function luck() { return luckCounter; }
function spendLuck() { luckCounter = (luckCounter + 1) % TW; }

/* Start at row 1 - never row 0 - and take the counter as a column.  Accept
   the first cell whose terrain is bare; ladders, ropes, gold, false bricks
   and open holes are all refused.  Every refusal spends the counter, and when
   it wraps the search drops to the next row down (CODE 1 @0x5730). */
function guardReborn(g) {
  leaveTile(g.pos.x, g.pos.y);
  let by = 1, bx = luck();
  for (let guard = 0; guard < TW * TH; guard++) {
    if (by >= TH) { by = 1; break; }
    if (map[bx][by].base === EMPTY) break;
    spendLuck();
    bx = luck();
    if (bx === 0) by++;
  }
  if (by >= TH) { by = 1; bx = luck(); }
  g.pos = { x: bx, y: by, xOffset: 0, yOffset: 0 };
  g.action = A_REBORN;
  g.anim = "born";
  g.bornTick = 0;
  g.hasGold = 0;
  g.shakeTick = 0;
  g.dist = 0;
  map[bx][by].act = GUARD;
  sfx("born");
}

function processBorn() {
  for (const g of guards) {
    if (g.action !== A_REBORN) continue;
    g.anim = "born";
    /* No death check here: materialising on top of the runner is survivable
       in the original, which only kills on a guard's own completed move. */
    if (++g.bornTick >= BORN_TICKS) {
      g.action = A_FALL;
      g.anim = "fall";
    }
  }
}

/* ========================================================================
   Rendering
   ======================================================================== */
let cv, ctx, terrainCv, terrainCtx;
let scale = 3;      /* CSS px per art pixel, fractional */
let PX = 1;         /* device px per art pixel, fractional */
const CHROME = 8;   /* #wrap border (2px) + padding (2px), both sides */

/* Which crumble mask to show `elapsed` into a window of `span` ticks: 0 for
   the least eroded, MASKS.length-1 for the most, spread evenly and clamped. */
function maskStage(elapsed, span) {
  const i = Math.floor(elapsed * MASKS.length / span);
  return Math.max(0, Math.min(MASKS.length - 1, i));
}

function tileSprite(x, y) {
  const c = map[x][y];
  switch (c.base) {
    case BRICK: {
      /* The crumble runs the masks forward across the whole dig and the refill
         runs the same masks backward across the warning, so the two read as one
         animation played either way.  Both derive the stage from MASKS.length,
         so adding a mask or retiming the dig needs no arithmetic here. */
      if (digging && digging.x === x && digging.y === y)
        return SP["brickMask" + maskStage(digging.tick - 1, DIG_TICKS)];
      for (const h of holes) {
        if (h.x !== x || h.y !== y) continue;
        const left = HOLE_TICKS - h.t;
        if (left > HOLE_WARN) return null;                    /* wide open */
        return SP["brickMask" + maskStage(left - 1, HOLE_WARN)];
      }
      return SP.brick;
    }
    case STEEL:   return SP.steel;
    case LADDER:  return SP.ladder;
    case ROPE:    return SP.rope;
    case GOLD:    return SP.gold;
    case TRAP:    return c.trapSeen ? SP.trapOpen : SP.brick;
    default:      return null;
  }
}

/* Round BOTH edges of the destination rect and take the difference - never
   round the origin and add a fractional width.  At a fractional scale the
   latter leaves 1px background gaps between terrain tiles; this way tile n's
   right edge is exactly tile n+1's left edge, so brickwork stays seamless at
   any zoom.  Smoothing stays off, so art pixels are nearest-neighbour and
   vary by at most one device pixel in width. */
function blit(c, sprite, lx, ly) {
  if (!sprite) return;
  const tx = lx / LW, ty = ly / LH;
  const x0 = Math.round(tx * AW * PX), x1 = Math.round((tx + 1) * AW * PX);
  const y0 = Math.round(ty * AH * PX), y1 = Math.round((ty + 1) * AH * PX);
  c.drawImage(sprite, 0, 0, AW, AH, x0, y0, x1 - x0, y1 - y0);
}

function drawTerrain() {
  terrainCtx.clearRect(0, 0, terrainCv.width, terrainCv.height);
  for (let x = 0; x < TW; x++)
    for (let y = 0; y < TH; y++)
      blit(terrainCtx, tileSprite(x, y), x * LW, y * LH);
  terrainDirty = false;
}

const RUN_CYCLE  = ["run1", "run2", "run3", "run2"];
const HANG_CYCLE = ["hang1", "hang2", "hang3", "hang2"];
const SHAKE_CYCLE = ["shake1", "shake2", "shake3", "shake2"];

/* Frame choice is a function of distance actually travelled, not of elapsed
   time.  That is what stops the legs from skating and freezes an actor
   mid-stride the moment it is blocked. */
function actorSprite(a, isGuard) {
  const pre = isGuard ? "g_" : "r_";
  const flip = a.face < 0 ? "_L" : "";
  switch (a.anim) {
    case "run":   return SP[pre + RUN_CYCLE[Math.floor(a.dist / 10) % 4] + flip];
    case "hang":  return SP[pre + HANG_CYCLE[Math.floor(a.dist / 10) % 4] + flip];
    /* Half a tile per flip.  The divisor has to divide the 40-unit tile or the
       mirror lands somewhere different on every tile climbed and reads as a
       jitter rather than a gait. */
    case "climb": return SP[pre + "climb" + (Math.floor(a.dist / (LH / 2)) % 2 ? "_L" : "")];
    case "fall":  return SP[pre + "fall" + flip];
    case "shoot": {
      /* One flash per crumble stage rather than per tick: at this tick rate an
         every-other-tick strobe is a buzz, and pulsing with the damage ties the
         muzzle to the brick coming apart. */
      const span = DIG_TICKS / MASKS.length;
      const lit = digging && digging.tick <= DIG_TICKS
                  && ((digging.tick - 1) % span) < span / 2;
      return SP[pre + (lit ? "shoot" : "shootDim") + flip];
    }
    case "shake": return SP[pre + SHAKE_CYCLE[Math.floor(a.shakeTick / 4) % 4]];
    case "die": {
      /* the runner's own shake frames, in order: arms up, arms flung out,
         then sunk low - so death reads as being dragged under */
      const t = a.dieTick;
      if (t < 8)  return SP[pre + "shake1"];
      if (t < 16) return SP[pre + "shake2"];
      if (t < 24) return SP[pre + "shake3"];
      return null;                     /* gone for the last few ticks */
    }
    case "born":  return SP[pre + (a.bornTick < BORN_TICKS / 2 ? "born1" : "born2")];
    default:      return SP[pre + "run2" + flip];
  }
}

function draw() {
  /* The writeup calls layout() when it lands, which can be before the levels
     have arrived and built a map - so there is a window where there is a
     canvas but nothing to put on it. */
  if (!ctx || !map.length) return;
  if (terrainDirty) drawTerrain();
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(terrainCv, 0, 0);

  for (const g of guards) {
    const lx = g.pos.x * LW + g.pos.xOffset, ly = g.pos.y * LH + g.pos.yOffset;
    blit(ctx, actorSprite(g, true), lx, ly);
    if (g.hasGold > 0) {
      ctx.fillStyle = "#ffe860";
      const d = Math.max(2, Math.round(2 * PX));
      ctx.fillRect(Math.round((lx / LW * AW + 8) * PX),
                   Math.round(ly / LH * AH * PX), d, d);
    }
  }
  if (runner)
    blit(ctx, actorSprite(runner, false),
         runner.pos.x * LW + runner.pos.xOffset, runner.pos.y * LH + runner.pos.yOffset);
}

/* Fit the board to the window, preserving its 504:272 aspect exactly, with
   --margin of clear space at the top, left and right.  The scale is a float,
   so zoom is continuous rather than jumping between integer steps. */
function layout() {
  if (!ctx) return;                  /* nothing sized yet; see draw() */
  const root = document.documentElement;
  const cs = getComputedStyle(root);
  const m = parseFloat(cs.getPropertyValue("--margin")) || 20;
  const gutter = parseFloat(cs.getPropertyValue("--gutter")) || 58;
  const col = el("column"), about = el("about"), body = document.body;
  const fit = function (w, h) {
    return Math.min(Math.max(160, w) / (TW * AW), Math.max(90, h) / (TH * AH));
  };
  let cssW = 0, cssH = 0;

  /* Two passes: setting the column width can rewrap the key bank, which
     changes its height, which feeds back into the height left for the board. */
  for (let pass = 0; pass < 2; pass++) {
    const W = root.clientWidth, H = root.clientHeight;

    /* Arrangement A, stack: legend above the board, HUD below it.  Only a
       top margin is charged, since the writeup supplies its own spacing. */
    body.classList.remove("gutter");
    const stackChrome = el("keys").offsetHeight + el("hud").offsetHeight;
    const stackScale = fit(W - 2 * m - CHROME, H - m - stackChrome - CHROME);

    /* Arrangement B, gutters: HUD and commands in the side bands the fixed
       aspect already forces, so the board gets the whole height. */
    const gutterScale = fit(W - 2 * (gutter + m) - CHROME, H - 2 * m - CHROME);

    /* Keep whichever actually makes the board bigger.  No breakpoint to
       guess at: on a tall window the stack wins, on a phone in landscape the
       gutters win, and the crossover looks after itself. */
    const useGutter = gutterScale > stackScale;
    body.classList.toggle("gutter", useGutter);
    scale = useGutter ? gutterScale : stackScale;

    cssW = Math.round(TW * AW * scale);
    cssH = Math.round(TH * AH * scale);
    col.style.width = (cssW + CHROME) + "px";
    about.style.width = (cssW + CHROME) + "px";
    cv.style.height = cssH + "px";      /* CSS width comes from width:100% */
  }

  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  terrainCv.width = cv.width;
  terrainCv.height = cv.height;
  PX = cv.width / (TW * AW);
  ctx.imageSmoothingEnabled = false;
  terrainCtx.imageSmoothingEnabled = false;
  terrainDirty = true;
  draw();
}

/* Dragging the window to a monitor with a different pixel ratio fires no
   resize event, so watch the resolution directly and re-render sharply. */
let dprQuery = null;
function onDprChange() { watchDpr(); layout(); }
function watchDpr() {
  if (dprQuery && dprQuery.removeEventListener)
    dprQuery.removeEventListener("change", onDprChange);
  dprQuery = matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
  if (dprQuery.addEventListener) dprQuery.addEventListener("change", onDprChange);
}

/* ========================================================================
   Audio.  Everything is synthesized; there are no audio assets.
   ======================================================================== */
let actx = null, master = null, muted = false;

/* Everything routes through one master gain, so the layered sounds (the
   blaster stacks four voices) sum without clipping. */
function audio() {
  if (actx === null) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { actx = false; }
    if (actx) {
      master = actx.createGain();
      master.gain.value = 0.55;
      master.connect(actx.destination);
    }
  }
  if (actx && actx.state === "suspended") actx.resume();
  return actx || null;
}

function tone(freq, dur, type, gain, slideTo, delay) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  gn.gain.setValueAtTime(gain, t0);
  gn.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(gn); gn.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

function noise(dur, gain, cut, cutTo) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(cut || 1200, a.currentTime);
  if (cutTo) f.frequency.exponentialRampToValueAtTime(Math.max(60, cutTo), a.currentTime + dur);
  const gn = a.createGain(); gn.gain.value = gain;
  src.connect(f); f.connect(gn); gn.connect(master);
  src.start();
}

/* ---------------------------------------------------------------------
   The blaster: "zee-yoo-yoo-yoo".

   The previous attempt used ring modulation and a tanh waveshaper, which is
   why it came out as a crunch: both generate inharmonic content, and that
   reads as noise rather than as pitch.  This version is deliberately clean
   and tonal - you should be able to hum it.

     zee       a bright square carrier starting high, with a lowpass that
               opens at the attack, so the onset has an edge to it
     yoo-yoo   a SAWTOOTH LFO into the carrier frequency, with negative
               depth.  A sine LFO glides up and down symmetrically, which
               is a wobble; an inverted sawtooth jumps the pitch up and
               then slides it down, once per cycle, which is a "yoo"
     slow      about 8 Hz, so the cycles are heard as separate swoops.
               Around 19 Hz they smear together into a buzz
     descent   the whole thing sweeps downward underneath the warble

   No ring modulation, no waveshaper, no noise burst.  Every knob is an
   argument, so variants can be auditioned from the console:
       blaster({warbleHz: 6, warbleDep: -600, f0: 1500})
       blaster({warbleHz: 12, dur: 0.7})
   --------------------------------------------------------------------- */
let GRIT_CURVE = null;

function gritCurve(amount) {
  const n = 1024, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    curve[i] = Math.tanh(x * amount);
  }
  return curve;
}

function blaster(o, ctxOverride, destOverride) {
  o = o || {};
  const a = ctxOverride || audio();
  if (!a) return;
  const dest = destOverride || master;
  const t = ctxOverride ? 0 : a.currentTime;

  /* Default the shot to exactly as long as the dig takes, so retuning the
     tick rate cannot leave the sound finishing before the brick does. */
  const dur       = o.dur       !== undefined ? o.dur       : DIG_TICKS * TICK_MS / 1000;
  const f0        = o.f0        !== undefined ? o.f0        : 1150;  /* the "zee" */
  const f1        = o.f1        !== undefined ? o.f1        : 190;
  const warbleHz  = o.warbleHz  !== undefined ? o.warbleHz  : 8;     /* the "yoo"s */
  const warbleDep = o.warbleDep !== undefined ? o.warbleDep : -430;
  const cut0      = o.cut0      !== undefined ? o.cut0      : 6000;
  const cut1      = o.cut1      !== undefined ? o.cut1      : 900;
  const trem      = o.trem      !== undefined ? o.trem      : 0.22;
  const grit      = o.grit      !== undefined ? o.grit      : 0;
  const gain      = o.gain      !== undefined ? o.gain      : 0.17;
  const wave      = o.wave      !== undefined ? o.wave      : "square";

  const carrier = a.createOscillator();
  carrier.type = wave;
  carrier.frequency.setValueAtTime(f0, t);
  carrier.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);

  /* the warble.  Sawtooth ramps upward over each cycle, so a NEGATIVE depth
     inverts it: pitch snaps up, then slides down.  That fall is the "yoo". */
  const lfo = a.createOscillator(), depth = a.createGain();
  lfo.type = "sawtooth";
  lfo.frequency.setValueAtTime(warbleHz, t);
  lfo.frequency.linearRampToValueAtTime(warbleHz * 0.65, t + dur);
  depth.gain.setValueAtTime(warbleDep, t);
  lfo.connect(depth);
  depth.connect(carrier.frequency);

  /* brightness follows the pitch down, so the tail is not shrill */
  const lp = a.createBiquadFilter();
  lp.type = "lowpass";
  lp.Q.setValueAtTime(1.2, t);
  lp.frequency.setValueAtTime(cut0, t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(200, cut1), t + dur);

  /* a shallow amplitude dip on the same cycle articulates each "yoo" */
  const tremGain = a.createGain(), tremDepth = a.createGain();
  tremGain.gain.setValueAtTime(1 - trem, t);
  tremDepth.gain.setValueAtTime(trem, t);
  lfo.connect(tremDepth);
  tremDepth.connect(tremGain.gain);

  const env = a.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(gain, t + 0.008);
  env.gain.exponentialRampToValueAtTime(0.0008, t + dur);

  let head = carrier;
  if (grit > 0) {
    const shaper = a.createWaveShaper();
    if (!GRIT_CURVE) GRIT_CURVE = gritCurve(grit);
    shaper.curve = GRIT_CURVE;
    shaper.oversample = "2x";
    head.connect(shaper);
    head = shaper;
  }
  head.connect(lp); lp.connect(tremGain); tremGain.connect(env); env.connect(dest);

  const stop = t + dur + 0.03;
  carrier.start(t); lfo.start(t);
  carrier.stop(stop); lfo.stop(stop);
}

/* The fall is one oscillator held for the whole descent, with its pitch
   ramping down the entire time - so the glide is genuinely continuous and a
   long drop falls further than a short one, instead of every fall replaying
   the same fixed blip. */
let fallVoice = null;

function fallStart() {
  if (muted) return;
  const a = audio(); if (!a) return;
  fallStop();
  const t = a.currentTime;
  const o = a.createOscillator(), gn = a.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(920, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 2.2);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.085, t + 0.025);
  o.connect(gn); gn.connect(master);
  o.start(t);
  fallVoice = { o: o, gn: gn };
}

function fallStop() {
  const v = fallVoice;
  if (!v) return;
  fallVoice = null;
  if (!actx) return;
  const t = actx.currentTime;
  v.gn.gain.cancelScheduledValues(t);
  v.gn.gain.setValueAtTime(Math.max(v.gn.gain.value || 0.0001, 0.0001), t);
  v.gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  v.o.stop(t + 0.09);
}

const SFX = {
  /* The blaster, four layers deep so it reads as a shot rather than a thud:
     a descending "pew", a softer harmonic under it, a bright crack of brick
     shattering that darkens as the debris settles, and a low thump for weight. */
  /* Nothing but the tone: a noise layer here is what made it crunch. */
  shoot:  function () { blaster(); },
  /* And a small thud on touchdown, only after a drop worth hearing. */
  land:   function () { noise(0.09, 0.13, 520); tone(95, 0.13, "sine", 0.11, 55); },
  gold:   function () { tone(880, 0.07, "square", 0.12); tone(1320, 0.10, "square", 0.12, 0, 0.07); },
  trap:   function () { noise(0.24, 0.26, 380); tone(130, 0.22, "square", 0.11, 55); },
  born:   function () { tone(180, 0.18, "triangle", 0.10, 880); },
  dead:   function () { tone(420, 0.55, "sawtooth", 0.14, 55); },
  reveal: function () { [523, 784, 1047].forEach(function (f, i) { tone(f, 0.13, "triangle", 0.10, 0, i * 0.07); }); },
  pass:   function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.15, "square", 0.11, 0, i * 0.09); }); },
  win:    function () { [523, 659, 784, 1047, 988, 1047, 1319].forEach(function (f, i) { tone(f, 0.26, "square", 0.12, 0, i * 0.16); }); }
};

function sfx(name) { if (muted) return; const f = SFX[name]; if (f) f(); }

/* ========================================================================
   Input.  Both control sets are live at once and fully interchangeable.
   ======================================================================== */
const KEYMAP = {
  KeyA: "left",  KeyJ: "left",  ArrowLeft:  "left",
  KeyD: "right", KeyL: "right", ArrowRight: "right",
  KeyW: "up",    KeyI: "up",    ArrowUp:    "up",
  KeyS: "down",  KeyK: "down",  ArrowDown:  "down",
  KeyQ: "shootL", KeyU: "shootL",
  KeyE: "shootR", KeyO: "shootR"
};
const DIR2ACT = { left: A_LEFT, right: A_RIGHT, up: A_UP, down: A_DOWN };

let held = [], latched = false, latchedDir = null, jumpBuf = "";

function refreshAction() {
  if (held.length) { latchedDir = held[held.length - 1]; keyAction = DIR2ACT[latchedDir]; }
  else if (padDir) { latchedDir = padDir; keyAction = DIR2ACT[padDir]; }
  else if (latched && latchedDir) keyAction = DIR2ACT[latchedDir];
  else keyAction = A_STOP;
}

function onKeyDown(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const code = e.code;
  if (code === "Tab" || code.indexOf("Shift") === 0) return;

  /* A gameplay key (or Space) lifts the freeze, and then still acts - so the
     key that starts the level also moves you.  Space is the exception: it
     would otherwise immediately pause what it just started.  The non-gameplay
     keys below deliberately do NOT unfreeze, which lets you browse levels
     with [ ] or mute with M while the board sits still. */
  if (state === "ready" && (KEYMAP[code] || code === "Space")) {
    e.preventDefault();
    audio();
    state = "run";
    refreshHint();
    if (code === "Space") return;
  }

  if (code === "Space") {
    e.preventDefault();
    if (state === "run") { fallStop(); state = "pause"; el("pause").classList.remove("hide"); }
    else if (state === "pause") { state = "run"; el("pause").classList.add("hide"); }
    return;
  }
  if (code === "KeyR") { e.preventDefault(); startLevel(state === "win" ? 0 : level); return; }
  if (code === "KeyM") {
    e.preventDefault(); muted = !muted;
    if (muted) fallStop();
    el("hudSound").textContent = muted ? "off" : "on";
    return;
  }
  if (code === "KeyT") { e.preventDefault(); latched = !latched; if (!latched) latchedDir = null; return; }
  /* `Equal` is the physical =/+ key, so typing `=` and typing Shift-= both
     land here; Ctrl/Cmd combinations already returned above, so browser zoom
     is untouched. */
  if (code === "Minus" || code === "NumpadSubtract") { e.preventDefault(); setSpeed(speedIndex - 1); return; }
  if (code === "Equal" || code === "NumpadAdd")      { e.preventDefault(); setSpeed(speedIndex + 1); return; }
  if (code === "BracketLeft")  { e.preventDefault(); startLevel(Math.max(0, level - 1)); return; }
  if (code === "BracketRight") { e.preventDefault(); startLevel(Math.min(LEVELS.length - 1, level + 1)); return; }
  if (/^Digit[0-9]$/.test(code)) {
    e.preventDefault();
    jumpBuf = (jumpBuf + code.slice(5)).slice(-3);
    showHint("jump to level " + jumpBuf + " - press Enter");
    return;
  }
  if (code === "Enter") {
    e.preventDefault();
    const n = parseInt(jumpBuf, 10);
    jumpBuf = "";
    if (n >= 1 && n <= LEVELS.length) startLevel(n - 1);
    return;
  }

  const k = KEYMAP[code];
  if (!k) return;
  e.preventDefault();
  if (k === "shootL") { pendingShoot = -1; return; }
  if (k === "shootR") { pendingShoot = 1;  return; }
  if (held.indexOf(k) < 0) held.push(k);
  refreshAction();
}

function onKeyUp(e) {
  const k = KEYMAP[e.code];
  if (!k || k.indexOf("shoot") === 0) return;
  const i = held.indexOf(k);
  if (i >= 0) held.splice(i, 1);
  refreshAction();
}

let hintTimer = 0;

const TAGLINE = "Collect every chest, then climb out of the top.";

/* Shown in the HUD's centre slot, outside the border, so the frozen state is
   cued without shading any part of the board. */
function refreshHint() {
  const t = el("tagline"), frozen = state === "ready";
  t.textContent = frozen ? "press any key to start" : TAGLINE;
  t.classList.toggle("cue", frozen);
}

function showHint(text) {
  clearTimeout(hintTimer);
  const t = el("tagline");
  t.textContent = text;
  t.classList.add("cue");
  hintTimer = setTimeout(refreshHint, 2200);
}

/* ========================================================================
   Gamepad.  Undocumented on purpose - it just works when a pad is attached.

       D-pad or left stick   move
       A                     shoot right        B      shoot left
       R / RT                shoot right        L / LT shoot left
       Start                 pause              Back   restart the level

   Start and Back matter more than they look. On a phone with a controller
   there is no keyboard at all, so without them there would be no way to
   pause, and no way out of a level you had made unwinnable.

   The API reports button state rather than firing events, so this is polled
   from the frame loop.  Two robustness notes: an 8BitDo Zero has no analog
   stick, and depending on its mode it reports the D-pad either as buttons
   12-15 or as axes 0/1, so both are read; and directions must be
   edge-triggered to lift the frozen start, otherwise holding the D-pad
   through a level transition would skip past the frozen board that holding
   a key correctly does not.
   ======================================================================== */
const PAD_DEADZONE = 0.5;
let padDir = null;             /* direction currently held on the pad */
const padWas = {};             /* previous frame, for edge detection */

function padDown(gp, i) {
  const b = gp.buttons[i];
  return !!b && (typeof b === "object" ? b.pressed : b > 0.5);
}

function pollPad() {
  if (!navigator.getGamepads) return;
  let gp = null;
  const pads = navigator.getGamepads();
  for (let i = 0; i < pads.length; i++)
    if (pads[i] && pads[i].connected) { gp = pads[i]; break; }

  if (!gp) {
    if (padDir !== null) { padDir = null; refreshAction(); }
    return;
  }

  const ax = gp.axes || [];
  const up    = padDown(gp, 12) || ax[1] < -PAD_DEADZONE;
  const down  = padDown(gp, 13) || ax[1] >  PAD_DEADZONE;
  const left  = padDown(gp, 14) || ax[0] < -PAD_DEADZONE;
  const right = padDown(gp, 15) || ax[0] >  PAD_DEADZONE;
  /* vertical wins a diagonal, so ladders stay reliable under a sloppy thumb */
  const dir = up ? "up" : down ? "down" : left ? "left" : right ? "right" : null;

  const edge = function (name, now) {
    const was = padWas[name];
    padWas[name] = now;
    return now && !was;
  };
  const hitDir     = edge("dir",     dir !== null);
  /* Buttons 0 and 1 are POSITIONS in the standard mapping - bottom and
     right - and the standard names them A and B the Xbox way round.  8BitDo
     pads carry Nintendo's physical labelling, where A is the right button
     and B is the bottom one, so the button printed A arrives as index 1 and
     the one printed B as index 0.  Mapped by printed label, not by index. */
  const hitShootR  = edge("shootR",  padDown(gp, 1) || padDown(gp, 5) || padDown(gp, 7));
  const hitShootL  = edge("shootL",  padDown(gp, 0) || padDown(gp, 4) || padDown(gp, 6));
  const hitPause   = edge("pause",   padDown(gp, 9));
  const hitRestart = edge("restart", padDown(gp, 8));

  if (hitRestart) { startLevel(level); padDir = dir; return; }

  if (state === "ready" && (hitDir || hitShootR || hitShootL || hitPause)) {
    audio();
    state = "run";
    refreshHint();
    /* the input that unfroze must not also pause, matching Space */
    if (hitPause) { if (dir !== padDir) { padDir = dir; refreshAction(); } return; }
  } else if (hitPause) {
    if (state === "run") { fallStop(); state = "pause"; el("pause").classList.remove("hide"); }
    else if (state === "pause") { state = "run"; el("pause").classList.add("hide"); }
  }

  if (hitShootR) pendingShoot = 1;
  if (hitShootL) pendingShoot = -1;
  if (dir !== padDir) { padDir = dir; refreshAction(); }
}

/* ========================================================================
   Level flow
   ======================================================================== */
function updateHud() {
  el("hudLevel").textContent = String(level + 1);
  el("hudCount").textContent = String(LEVELS.length);
  el("hudSpeed").textContent = SPEEDS[speedIndex].name;
}

/* Everything that names the set comes from the level file, so this file is
   set-agnostic: point ?levels= somewhere else and the tab title, the win
   headline and the win sentence all follow it. */
function applySetStrings() {
  document.title = LEVEL_TITLE;
  el("winTitle").textContent = "All " + LEVELS.length + " levels complete";
  el("winNote").textContent = LEVEL_WIN;
}

/* `-` and `+` step through SPEEDS, clamped at the ends rather than wrapping:
   with only three settings, wrapping would turn one extra press of `+` into a
   jump from HI all the way down to LOW, and the indicator is the only
   feedback there is. */
function setSpeed(i) {
  const j = Math.max(0, Math.min(SPEEDS.length - 1, i));
  if (j === speedIndex) return;
  speedIndex = j;
  TICK_MS = BASE_TICK_MS / SPEEDS[speedIndex].rate;
  /* the accumulator is in milliseconds, so it is rate-independent - but it
     can be holding almost a whole OLD tick, which would drain into two ticks
     back to back on the way up.  Dropping it makes the change crisp. */
  acc = 0;
  updateHud();
}

/* Every level entry starts frozen: page load, advancing a level, R, [ ], a
   digit jump, and after being captured or crushed.  The opening of a level is
   when you read the board and plan a route, so it has to be motionless AND
   unshaded - which is why this is its own state and not "pause". */
function startLevel(n) {
  level = n;
  fallStop();
  state = "ready";
  held = []; latchedDir = null; keyAction = A_STOP; pendingShoot = 0;
  el("pause").classList.add("hide");
  el("win").classList.add("hide");
  buildLevel(n);
  refreshHint();
}

function levelPassed() {
  state = "pass";
  passTimer = 34;
  sfx("pass");
}

function doWin() {
  state = "win";
  el("win").classList.remove("hide");
  sfx("win");
}

function tick() {
  if (state === "ready") return;      /* frozen - study the board in safety */
  if (state === "run") {
    /* The original wants you dead centre in the top row, not merely near it */
    if (goldComplete && runner.pos.y === 0 && runner.pos.yOffset === 0) {
      levelPassed();
      return;
    }
    spendLuck();
    if (digging) processDig(); else moveRunner();
    if (state === "run") moveGuards();
    processHoles();
    processBorn();
  } else if (state === "dead") {
    runner.dieTick++;
    if (--deadTimer <= 0) startLevel(level);
  } else if (state === "pass") {
    if (--passTimer <= 0) {
      if (level >= LEVELS.length - 1) doWin();
      else startLevel(level + 1);
    }
  }
}

let acc = 0, lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  pollPad();
  if (!lastTs) lastTs = ts;
  let dt = ts - lastTs;
  lastTs = ts;
  if (dt > 250) dt = 250;
  acc += dt;
  let n = 0;
  while (acc >= TICK_MS && n < 5) { acc -= TICK_MS; tick(); n++; }
  if (acc > TICK_MS) acc = 0;
  draw();
}

/* ========================================================================
   Sprite sheet debug view:  index.html?spritesheet
   ======================================================================== */
function spriteSheet() {
  document.body.innerHTML = '<div id="sheet"></div>';
  const box = el("sheet");
  const S = 4;
  function group(title, items) {
    const h = document.createElement("h3"); h.textContent = title; box.appendChild(h);
    const row = document.createElement("div"); row.className = "row";
    items.forEach(function (it) {
      const fig = document.createElement("figure");
      const c = document.createElement("canvas");
      c.width = AW * S; c.height = AH * S;
      c.style.width = (AW * S) + "px";
      c.style.imageRendering = "pixelated";
      c.style.background = "#101418";
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = false;
      if (SP[it]) g.drawImage(SP[it], 0, 0, AW, AH, 0, 0, AW * S, AH * S);
      const cap = document.createElement("figcaption"); cap.textContent = it;
      fig.appendChild(c); fig.appendChild(cap); row.appendChild(fig);
    });
    box.appendChild(row);
  }
  group("terrain", TERRAIN_KEYS.concat(["trapOpen"]));
  group("blast / refill masks", ["brickMask0", "brickMask1", "brickMask2"]);
  group("runner, right-facing", POSE_KEYS.map(function (k) { return "r_" + k; }).concat(["r_shootDim"]));
  group("runner, left-facing",  POSE_KEYS.map(function (k) { return "r_" + k + "_L"; }));
  group("guard, right-facing",  POSE_KEYS.map(function (k) { return "g_" + k; }));
  group("guard, left-facing",   POSE_KEYS.map(function (k) { return "g_" + k + "_L"; }));
  group("run cycle in order",   RUN_CYCLE.map(function (k) { return "r_" + k; }));
  group("climb cycle in order", ["r_climb", "r_climb_L"]);
  group("hang cycle in order",  HANG_CYCLE.map(function (k) { return "r_" + k; }));
  group("shake cycle in order", SHAKE_CYCLE.map(function (k) { return "g_" + k; }));
}

/* ========================================================================
   Boot
   ======================================================================== */
function validateLevels(url) {
  LEVELS.forEach(function (s, i) {
    const where = url + " level " + (i + 1);
    if (s.length !== TW * TH) throw Error(where + " is " + s.length + " chars");
    let p = 0, g = 0, gold = 0;
    for (const ch of s) {
      if (!(ch in CHAR2TILE)) throw Error(where + ': bad char "' + ch + '"');
      if (ch === "P") p++; else if (ch === "G") g++; else if (ch === "$") gold++;
    }
    if (p !== 1) throw Error(where + " has " + p + " players");
    if (g > 5) throw Error(where + " has " + g + " guards");
    if (gold < 1) throw Error(where + " has no gold");
  });
  console.log("levels ok: " + LEVELS.length + " levels from " + url + ", " +
              TW + "x" + TH + ", exactly one player each, <=5 guards, " +
              "gold in every level");
}

/* fetch() rejects opaquely for both of the causes that actually come up, so
   name them.  A file:// page cannot fetch anything at all, which is by far the
   most likely way to land here, so that one gets the remedy spelled out. */
async function fetchText(url) {
  let res;
  try {
    res = await fetch(url, { cache: "no-cache" });
  } catch (err) {
    throw Error("could not fetch " + url + ": " + err.message + "\n\n" +
      (location.protocol === "file:"
        ? "This page was opened with file://, and a file:// page is not " +
          "allowed to fetch anything.  Serve the folder over HTTP instead:\n" +
          "    python3 -m http.server\nthen open http://localhost:8000/"
        : "If that URL is on another site, that site has to send CORS " +
          "headers (Access-Control-Allow-Origin)."));
  }
  if (!res.ok)
    throw Error("fetching " + url + " returned HTTP " + res.status +
                " " + res.statusText);
  return res.text();
}

const MD_BEGIN = "<!-- BEGIN HERE -->", MD_END = "<!-- END HERE -->";

/* Only the text between the markers is shown, so a Markdown file can carry a
   title, a play link and a banner that belong on GitHub but not here.  Both
   markers are optional: with no BEGIN HERE the writeup starts at the top of
   the file, and with no END HERE it runs to the bottom - so ?readme= can point
   at any plain Markdown file.  Two of either is still an error, since which
   one wins would only ever be a guess. */
function extractWriteup(text, url) {
  const nb = text.split(MD_BEGIN).length - 1;
  const ne = text.split(MD_END).length - 1;
  if (nb > 1) throw Error(url + " has " + nb + " " + MD_BEGIN +
                          " markers; expected at most one");
  if (ne > 1) throw Error(url + " has " + ne + " " + MD_END +
                          " markers; expected at most one");
  const a = nb ? text.indexOf(MD_BEGIN) + MD_BEGIN.length : 0;
  const b = ne ? text.indexOf(MD_END) : text.length;
  if (b < a) throw Error(url + " has " + MD_END + " before " + MD_BEGIN);
  const md = text.slice(a, b).trim();
  if (!md) throw Error(url + " has no text to show");
  return md;
}

/* The CDN scripts are deferred, so they run after this inline script but
   before DOMContentLoaded - which is therefore the event to wait on.  Note
   that readyState is already "interactive" while a deferred script is still
   pending, so only "complete" means DOMContentLoaded has been and gone. */
async function whenRenderer() {
  if (!window.marked || !window.DOMPurify) {
    if (document.readyState !== "complete")
      await new Promise(function (r) {
        document.addEventListener("DOMContentLoaded", r, { once: true });
      });
  }
  if (!window.marked || !window.DOMPurify)
    throw Error("the Markdown renderer failed to load from the CDN " +
                "(marked and DOMPurify)");
}

/* A relative link in Markdown means "relative to the Markdown", but the
   browser would resolve it against this page.  Identical for a writeup that
   sits beside index.html, wrong for any ?readme= that does not. */
function resolveRelative(root, base) {
  root.querySelectorAll("img[src], a[href]").forEach(function (n) {
    const attr = n.tagName === "IMG" ? "src" : "href";
    const raw = n.getAttribute(attr);
    if (!raw || raw[0] === "#" || raw.slice(0, 2) === "//" ||
        /^[a-z][a-z0-9+.-]*:/i.test(raw)) return;
    try { n.setAttribute(attr, new URL(raw, base).href); } catch (err) { /* leave it */ }
  });
}

/* Sanitized because ?readme= takes any URL, so without it a crafted link to
   this page could run someone else's script on this origin. */
async function showWriteup(url) {
  const text = await fetchText(url);
  await whenRenderer();
  const about = el("about");
  about.innerHTML = DOMPurify.sanitize(marked.parse(extractWriteup(text, url)));
  resolveRelative(about, new URL(url, location.href).href);
  layout();     /* the writeup can add a scrollbar, which changes the fit */
}

/* Two failure reports, and the difference between them is the point: the
   writeup is decoration, so losing it costs you the prose and nothing else,
   while losing the levels means there is no game to show.  Both build their
   message with textContent, never innerHTML - it quotes a URL that came from
   the query string. */
function report(target, heading, err) {
  target.textContent = "";
  const h = document.createElement("h2");
  h.textContent = heading;
  const p = document.createElement("pre");
  p.textContent = String((err && err.message) || err);
  target.appendChild(h);
  target.appendChild(p);
}

let writeupFailure = null;

function writeupFailed(err) {
  writeupFailure = err;
  console.error(err);
  if (document.body.classList.contains("loadfail")) return;
  report(el("about"), "The writeup could not be loaded", err);
  layout();
}

/* No levels, no game: take the board away rather than leave an empty frame,
   and let the message have the page.  The writeup, if it loaded, stays below -
   between them they still explain what this page is. */
function fatal(err) {
  document.body.classList.add("loadfail");
  el("stage").style.display = "none";
  el("about").style.width = "";
  if (writeupFailure) el("about").textContent = "";
  const box = el("loadfail");
  box.classList.remove("hide");
  console.error(err);
  report(box, "The game could not start", err);
}

async function init() {
  buildAtlas();

  /* The sprite sheet is a pure art dump, so it has to work with no level file
     at all - which means before anything is fetched. */
  if (QS.has("spritesheet")) { spriteSheet(); return; }

  /* Both requests go out now, in parallel.  Only the levels gate the start;
     the writeup arrives whenever it arrives. */
  const levelsReq = fetchText(LEVELS_URL);
  const writeupDone = showWriteup(README_URL).catch(writeupFailed);

  cv = el("cv");
  ctx = cv.getContext("2d");
  terrainCv = document.createElement("canvas");
  terrainCtx = terrainCv.getContext("2d");

  /* single source of truth for the frame colour: the ladder's own shade */
  document.documentElement.style.setProperty("--ladder-shade", PAL_TERRAIN.h);

  const set = parseLevelFile(await levelsReq, LEVELS_URL);
  LEVELS = set.boards;
  LEVEL_TITLE = set.title;
  LEVEL_WIN = set.win;
  validateLevels(LEVELS_URL);
  applySetStrings();

  startLevel(0);      /* builds the map, and leaves the board frozen */
  layout();           /* needs the map to exist, since it draws */
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);
  /* the URL bar collapsing on a phone resizes the visual viewport without
     always firing a window resize */
  if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
  watchDpr();
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);
  document.body.focus();
  document.body.addEventListener("mousedown", function () { document.body.focus(); });
  /* On a phone the only gesture may be a tap, and a gamepad button press is
     not a user activation, so autoplay policy needs this to unlock sound. */
  document.body.addEventListener("pointerdown", function () { audio(); });

  /* Taps are replayed as the corresponding keydown/keyup, so pause, restart,
     level change, speed and mute keep exactly one implementation each - and
     `-` and `+` are separate targets, the same way `[` and `]` are.
     pointerdown rather than click, so it responds without the tap delay. */
  el("keys").addEventListener("pointerdown", function (e) {
    const t = e.target.closest("[data-tap]");
    if (!t) return;
    e.preventDefault();
    audio();
    const code = t.dataset.tap;
    window.dispatchEvent(new KeyboardEvent("keydown", {code: code, bubbles: true, cancelable: true}));
    window.dispatchEvent(new KeyboardEvent("keyup",   {code: code, bubbles: true, cancelable: true}));
    document.body.focus();
  });
  window.addEventListener("gamepadconnected", function (e) {
    console.log("gamepad: " + e.gamepad.id + " (mapping: " +
                (e.gamepad.mapping || "non-standard") + ", " +
                e.gamepad.buttons.length + " buttons, " +
                e.gamepad.axes.length + " axes)");
  });

  requestAnimationFrame(frame);

  await writeupDone;
}

/* One handler for every fatal path: the fetch, the JSON, the board geometry
   and the content checks all land here. */
init().catch(fatal);
</script>
</body>
</html>
